<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge Quiz — Openingsbod & Vervolg</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef0f5;
  --white: #ffffff;
  --accent: #F48C00;
  --accent-light: #fff3e0;
  --navy: #1a2540;
  --navy-mid: #2e3f6e;
  --text: #1a2540;
  --muted: #7a8aaa;
  --border: #dde2ef;
  --correct: #27ae60;
  --correct-bg: #eafaf1;
  --correct-border: #82e0aa;
  --wrong: #e74c3c;
  --wrong-bg: #fdf2f1;
  --wrong-border: #f5b7b1;
  --red: #c0392b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  font-family: 'Nunito', sans-serif;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 48px;
}

/* ── Top bar ── */
.topbar {
  width: 100%;
  max-width: 520px;
  padding: 22px 20px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.dots { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
.dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #c8cfe0;
  transition: background 0.3s, transform 0.3s;
}
.dot.active { background: var(--accent); transform: scale(1.3); }
.dot.done   { background: var(--navy-mid); }
.step-label {
  font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--accent);
  display: flex; align-items: center; gap: 8px; width: 100%;
}
.step-label::after {
  content:''; flex:1; height:1.5px; background: var(--border);
}

/* ── Main card ── */
.main-card {
  background: var(--white);
  border-radius: 20px;
  box-shadow: 0 6px 28px rgba(26,37,64,0.11);
  margin: 14px 20px 0;
  padding: 28px 22px 24px;
  width: calc(100% - 40px);
  max-width: 520px;
}
.q-title {
  font-size: clamp(21px, 5vw, 27px);
  font-weight: 900; color: var(--navy);
  line-height: 1.2; margin-bottom: 6px;
}
.context-text {
  font-size: 14px; font-weight: 600; color: var(--muted);
  margin-bottom: 18px; line-height: 1.4;
}

/* ── Hand grid ── */
.hand-grid {
  background: #f4f6fb;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 12px;
}
.hand-suit-row { display:flex; align-items:center; gap:8px; }
.suit-sym { font-size: 17px; line-height:1; min-width:20px; }
.suit-s, .suit-c { color: var(--navy); }
.suit-h, .suit-d { color: var(--red); }
.hand-cards { font-size:14px; font-weight:700; color:var(--text); letter-spacing:0.02em; }

/* ── Bid sequence (linear, like the book) ── */
.bid-seq-wrap {
  margin-bottom: 22px;
}
.bid-seq-label {
  font-size: 10px; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
}
.bid-seq {
  display: flex;
  flex-direction: column;
  gap: 0;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.bid-seq-row {
  display: flex;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
}
.bid-seq-row:last-child { border-bottom: none; }

.bid-who {
  width: 90px;
  flex-shrink: 0;
  padding: 10px 12px;
  background: #f5f7fc;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  border-right: 1px solid var(--border);
}
.bid-who.me {
  color: var(--navy);
  background: #eef1fa;
}
.bid-val {
  flex: 1;
  padding: 10px 14px;
  font-size: 17px;
  font-weight: 800;
  color: var(--navy);
  display: flex;
  align-items: center;
}
.bid-val.dash { color: var(--muted); font-size: 15px; font-weight: 700; }
.bid-val.question {
  background: var(--accent-light);
  color: var(--accent);
  font-size: 20px;
}
.bid-val .s { color: var(--navy); }
.bid-val .h { color: var(--red); }
.bid-val .d { color: var(--red); }
.bid-val .c { color: var(--navy); }

/* ── Options ── */
.options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.opt-btn {
  background: var(--white);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 15px 10px;
  font-family: 'Nunito', sans-serif;
  font-size: 19px; font-weight: 800;
  color: var(--navy);
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 2px;
  box-shadow: 0 2px 6px rgba(26,37,64,0.06);
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-light);
  transform: translateY(-2px);
  box-shadow: 0 5px 14px rgba(244,140,0,0.18);
}
.opt-btn:disabled { cursor: default; }
.opt-btn.correct { border-color:var(--correct); background:var(--correct-bg); color:var(--correct); }
.opt-btn.wrong   { border-color:var(--wrong);   background:var(--wrong-bg);   color:var(--wrong); opacity:0.7; }
.opt-btn .s { color: var(--navy); }
.opt-btn .h { color: var(--red); }
.opt-btn .d { color: var(--red); }
.opt-btn .c { color: var(--navy); }

/* ── Feedback ── */
.feedback-box {
  display: none;
  margin-top: 16px;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 14px; font-weight: 600; line-height: 1.6;
  animation: popIn 0.2s ease;
}
.feedback-box.show { display: block; }
.feedback-box.correct { background:var(--correct-bg); border:1.5px solid var(--correct-border); color:#1a6637; }
.feedback-box.wrong   { background:var(--wrong-bg);   border:1.5px solid var(--wrong-border);   color:#8b2017; }
.fb-head {
  font-size: 11px; font-weight: 800; letter-spacing: 0.1em;
  text-transform: uppercase; margin-bottom: 5px;
}
.feedback-box.correct .fb-head { color: var(--correct); }
.feedback-box.wrong   .fb-head { color: var(--wrong); }
@keyframes popIn { from { opacity:0; transform:scale(0.97) translateY(4px); } to { opacity:1; transform:none; } }

/* ── Next button ── */
.next-wrap {
  display: none; padding: 0 20px;
  width: 100%; max-width: 520px; margin-top: 12px;
}
.next-wrap.show { display: block; }
.next-btn {
  width: 100%; background: var(--navy); color: #fff; border: none;
  border-radius: 14px; padding: 16px;
  font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800;
  cursor: pointer; transition: all 0.2s;
}
.next-btn:hover { background: var(--navy-mid); transform: translateY(-1px); }

/* ── Score screen ── */
.score-screen {
  display: none;
  width: calc(100% - 40px); max-width: 520px;
  background: var(--white); border-radius: 20px;
  box-shadow: 0 6px 28px rgba(26,37,64,0.11);
  margin: 40px 0; padding: 44px 28px; text-align: center;
}
.score-screen.show { display: block; }
.score-emoji { font-size: 52px; margin-bottom: 14px; }
.score-num { font-size: 68px; font-weight: 900; color: var(--accent); line-height:1; }
.score-denom { font-size:17px; font-weight:700; color:var(--muted); margin-bottom:14px; }
.score-msg { font-size:16px; font-weight:700; color:var(--navy); margin-bottom:32px; line-height:1.5; }
.restart-btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 14px; padding: 15px 40px;
  font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800;
  cursor: pointer; transition: all 0.2s;
}
.restart-btn:hover { background: #d47800; transform: translateY(-2px); }
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div class="dots" id="dots"></div>
  <div class="step-label" id="step-label"></div>
</div>

<div class="main-card" id="main-card"></div>

<div class="next-wrap" id="next-wrap">
  <button class="next-btn" id="next-btn" onclick="nextQuestion()">Volgende vraag →</button>
</div>

<div class="score-screen" id="score-screen">
  <div class="score-emoji" id="sc-emoji"></div>
  <div class="score-num" id="sc-num">—</div>
  <div class="score-denom" id="sc-denom"></div>
  <div class="score-msg" id="sc-msg"></div>
  <button class="restart-btn" onclick="restart()">↺ Opnieuw spelen</button>
</div>

<script>
// ── Suit coloring ─────────────────────────────────────────────────────
function colorSuits(txt) {
  return txt
    .replace(/♠/g, '<span class="s">♠</span>')
    .replace(/♥/g, '<span class="h">♥</span>')
    .replace(/♦/g, '<span class="d">♦</span>')
    .replace(/♣/g, '<span class="c">♣</span>');
}

// ── Data ──────────────────────────────────────────────────────────────
// seq: array of { who, bid }
//   who: label shown left ('Jij', 'Partner', etc.)
//   bid: the bid string, or 'pas', or '—' (pass), or '?' (answer slot)
//   me:  true → highlight row as "jouw bod"

const Q = [
  // ─── SET 1: jij hebt geopend, derde bod ──────────────────────────
  {
    title: 'Wat bied je?',
    context: 'Jij hebt het openingsbod gedaan',
    section: 'Openingsbod & herbieding',
    hand: { s:'7', h:'H V 9 6 4', d:'8 2', c:'A H 7 3 2' },
    seq: [
      { who:'Jij',     bid:'1♥',  me:true  },
      { who:'Partner', bid:'1SA', me:false },
      { who:'Jij',     bid:'2♣',  me:true  },
      { who:'Partner', bid:'2♦',  me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['pas','2♥','3♣','3♦'],
    answer: 'pas',
    explanation: 'Met 2♣ gaf jij partner de keuze tussen harten en klaveren. Partner koos 2♦ — hij heeft minstens zes ruiten maar weinig punten (minder dan 10). Jij hebt slechts 12 punten en past.'
  },
  {
    title: 'Wat bied je?',
    context: 'Jij hebt het openingsbod gedaan',
    section: 'Openingsbod & herbieding',
    hand: { s:'2', h:'10 5', d:'A H B 8 7 3', c:'A V 2' },
    seq: [
      { who:'Jij',     bid:'1♦',  me:true  },
      { who:'Partner', bid:'1♠',  me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['2♦','2♠','3♦','2SA'],
    answer: '3♦',
    explanation: 'Met 3♦ toon je een sterke zeskaart ruiten en extra speelwaarde. Je nodigt partner uit om de manche te bieden als hij meer heeft dan een minimum.'
  },
  {
    title: 'Wat bied je?',
    context: 'Jij hebt het openingsbod gedaan',
    section: 'Openingsbod & herbieding',
    hand: { s:'H V 3', h:'A B 10 6 4', d:'V', c:'H 9 8 4' },
    seq: [
      { who:'Jij',     bid:'1♥',  me:true  },
      { who:'Partner', bid:'1♠',  me:false },
      { who:'Jij',     bid:'2♣',  me:true  },
      { who:'Partner', bid:'2SA', me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['3SA','4♥','3♠','pas'],
    answer: '3♠',
    explanation: 'Samen ben je sterk genoeg voor de manche. Dat lijkt 3SA te worden. Maar partner kán nog een vijfkaart schoppen hebben. Met 3♠ vertel jij dat je er drie hebt. Partner kiest 4♠ of 3SA.'
  },

  // ─── SET 2: jij bent opener, partner heeft geantwoord ────────────
  {
    title: 'Wat bied je?',
    context: 'Jij bent met bieden begonnen, partner heeft geantwoord',
    section: 'Herbieding na partners antwoord',
    hand: { s:'H V 6', h:'B 4', d:'A V B 8 3', c:'A B 5' },
    seq: [
      { who:'Jij',     bid:'1♦',  me:true  },
      { who:'Partner', bid:'1♥',  me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['1SA','2SA','3SA','2♦'],
    answer: '2SA',
    explanation: 'Met 2SA toon je een evenwichtige verdeling met 18 of 19 punten. Je bent te sterk voor een 1SA-opening (15-17 punten).'
  },
  {
    title: 'Wat bied je na partners 1SA?',
    context: 'Jij bent met bieden begonnen, partner heeft geantwoord',
    section: 'Herbieding na partners antwoord',
    hand: { s:'A H B 8 5', h:'V 7 2', d:'H V 9', c:'H 6' },
    seq: [
      { who:'Jij',     bid:'1♠',  me:true  },
      { who:'Partner', bid:'1SA', me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['2SA','3SA','2♠','pas'],
    answer: '3SA',
    explanation: 'Met 18 punten wil je de manche spelen. Partners 1SA toont 6-10 punten — samen genoeg voor 3SA.'
  },
  {
    title: 'Wat bied je na partners 1♠?',
    context: 'Jij bent met bieden begonnen, partner heeft geantwoord',
    section: 'Herbieding na partners antwoord',
    hand: { s:'V 6', h:'A 5', d:'A V B 10 7 6', c:'V B 8' },
    seq: [
      { who:'Jij',     bid:'1♦',  me:true  },
      { who:'Partner', bid:'1♠',  me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['2♦','3♦','2SA','4♦'],
    answer: '3♦',
    explanation: 'Met 3♦ toon je zes goede ruiten met 16-17 punten. Als partner meer dan zijn minimum heeft, spelen jullie de manche.'
  },

  // ─── SET 3: partner geopend, jij tweede beurt ────────────────────
  {
    title: 'Wat bied je?',
    context: 'Partner heeft geopend, jij bent voor de tweede keer aan de beurt',
    section: 'Vervolg na partners opening',
    hand: { s:'V B 7 2', h:'H 6 5 3', d:'9 4', c:'8 4 2' },
    seq: [
      { who:'Partner', bid:'1♦',  me:false },
      { who:'Jij',     bid:'1♥',  me:true  },
      { who:'Partner', bid:'1SA', me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['pas','2♥','2♦','2SA'],
    answer: 'pas',
    explanation: 'Geen hartenfit, geen schoppenfit, en niet genoeg punten voor de manche. Het blijft bij 1SA.'
  },
  {
    title: 'Wat bied je?',
    context: 'Partner heeft geopend, jij bent voor de tweede keer aan de beurt',
    section: 'Vervolg na partners opening',
    hand: { s:'H 5', h:'H V 9 8 6 4', d:'8 4', c:'V 5 2' },
    seq: [
      { who:'Partner', bid:'1♣',  me:false },
      { who:'Jij',     bid:'1♥',  me:true  },
      { who:'Partner', bid:'1♠',  me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['2♥','3♥','2SA','pas'],
    answer: '3♥',
    explanation: 'Met dit sprongbod toon je een sterke zeskaart harten met 10-11 punten. Alleen bij een echt minimum van partner (12-13 punten) mag hij passen.'
  },
  {
    title: 'Wat bied je?',
    context: 'Partner heeft geopend, jij bent voor de tweede keer aan de beurt',
    section: 'Vervolg na partners opening',
    hand: { s:'H B 7 6 3 2', h:'9 7 6', d:'H 9', c:'5 4' },
    seq: [
      { who:'Partner', bid:'1♦',  me:false },
      { who:'Jij',     bid:'1♠',  me:true  },
      { who:'Partner', bid:'2SA', me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['pas','3SA','4♠','3♦'],
    answer: '4♠',
    explanation: 'Partners 2SA toont 18-19 punten — hij wil de manche. Jij hebt een schoppenfit en biedt 4♠.'
  },

  // ─── SET 4: pagina 1b ─────────────────────────────────────────────
  {
    title: 'Wat bied je?',
    context: 'Jij hebt het openingsbod gedaan',
    section: 'Openingsbod & herbieding',
    hand: { s:'5 2', h:'H V 6', d:'B 4', c:'A H 10 7 4 3' },
    seq: [
      { who:'Jij',     bid:'1♣',  me:true  },
      { who:'Partner', bid:'1♠',  me:false },
      { who:'Jij',     bid:'2♣',  me:true  },
      { who:'Partner', bid:'3♦',  me:false },
      { who:'Jij',     bid:'?',   me:true  },
    ],
    opts: ['3SA','3♠','4♣','pas'],
    answer: '3SA',
    explanation: 'Partner bood eerst schoppen, sloeg daarmee ruiten over, en biedt nu toch 3♦. Dat toont een vier- of vijfkaart ruiten mét genoeg punten voor de manche. Jij hebt stops in beide resterende kleuren en voldoende kracht — 3SA is het juiste contract.'
  },
];

// ── State ─────────────────────────────────────────────────────────────
let current = 0, score = 0, hasAnswered = false;
const total = Q.length;

// ── Render helpers ────────────────────────────────────────────────────
function renderDots() {
  document.getElementById('dots').innerHTML = Q.map((_,i) => {
    let c = 'dot';
    if (i === current) c += ' active';
    else if (i < current) c += ' done';
    return `<div class="${c}"></div>`;
  }).join('');
}

function renderStepLabel() {
  const q = Q[current];
  document.getElementById('step-label').textContent =
    `${q.section.toUpperCase()} · STAP ${current+1} VAN ${total}`;
}

function renderHandGrid(hand) {
  const suits = [
    { sym:'♠', cls:'suit-s', key:'s' },
    { sym:'♥', cls:'suit-h', key:'h' },
    { sym:'♦', cls:'suit-d', key:'d' },
    { sym:'♣', cls:'suit-c', key:'c' },
  ];
  return `<div class="hand-grid">${
    suits.map(su =>
      `<div class="hand-suit-row">
        <span class="suit-sym ${su.cls}">${su.sym}</span>
        <span class="hand-cards">${hand[su.key]}</span>
      </div>`
    ).join('')
  }</div>`;
}

function renderBidSeq(seq) {
  const rows = seq.map(step => {
    let valClass = 'bid-val';
    let valContent = '';

    if (step.bid === '?') {
      valClass += ' question';
      valContent = '?';
    } else if (step.bid === '—' || step.bid === 'pas') {
      valClass += ' dash';
      valContent = step.bid === '—' ? 'pas' : 'pas';
    } else {
      valContent = colorSuits(step.bid);
    }

    return `<div class="bid-seq-row">
      <div class="bid-who${step.me ? ' me' : ''}">${step.who}</div>
      <div class="${valClass}">${valContent}</div>
    </div>`;
  }).join('');

  return `<div class="bid-seq-wrap">
    <div class="bid-seq-label">Biedverloop</div>
    <div class="bid-seq">${rows}</div>
  </div>`;
}

function renderOptions(opts) {
  return `<div class="options">${
    opts.map((o, i) => {
      // Store the raw value in data-val to avoid attribute encoding issues
      return `<button class="opt-btn" id="ob-${i}" data-val="${i}" onclick="checkAns(${i})">${colorSuits(o)}</button>`;
    }).join('')
  }</div>`;
}

// ── Main render ───────────────────────────────────────────────────────
function renderQuestion() {
  hasAnswered = false;
  const q = Q[current];
  renderDots();
  renderStepLabel();

  document.getElementById('main-card').innerHTML =
    `<div class="q-title">${q.title}</div>` +
    `<div class="context-text">${q.context}</div>` +
    renderHandGrid(q.hand) +
    renderBidSeq(q.seq) +
    renderOptions(q.opts) +
    `<div class="feedback-box" id="fb-box">
      <div class="fb-head" id="fb-head"></div>
      <div id="fb-text"></div>
    </div>`;

  document.getElementById('next-wrap').classList.remove('show');
}

// ── Interaction ───────────────────────────────────────────────────────
function checkAns(idx) {
  if (hasAnswered) return;
  hasAnswered = true;

  const q = Q[current];
  const chosen = q.opts[idx];
  const correct = chosen === q.answer;
  if (correct) score++;

  // Style buttons
  q.opts.forEach((o, i) => {
    const btn = document.getElementById(`ob-${i}`);
    btn.disabled = true;
    if (o === q.answer) btn.classList.add('correct');
    else if (i === idx && !correct) btn.classList.add('wrong');
  });

  // Highlight the ? row in the sequence to show the answer
  const seqRows = document.querySelectorAll('.bid-seq-row');
  seqRows.forEach(row => {
    const val = row.querySelector('.bid-val');
    if (val && val.classList.contains('question')) {
      val.classList.remove('question');
      val.innerHTML = colorSuits(q.answer);
      val.style.color = correct ? 'var(--correct)' : 'var(--wrong)';
      val.style.background = correct ? 'var(--correct-bg)' : 'var(--wrong-bg)';
    }
  });

  // Feedback
  const fb = document.getElementById('fb-box');
  fb.className = `feedback-box show ${correct ? 'correct' : 'wrong'}`;
  document.getElementById('fb-head').textContent =
    correct ? '✓ Goed!' : `✗ Het goede bod was: ${q.answer}`;
  document.getElementById('fb-text').textContent = q.explanation;

  // Next button
  const nw = document.getElementById('next-wrap');
  nw.classList.add('show');
  document.getElementById('next-btn').textContent =
    current === total - 1 ? 'Bekijk je score →' : 'Volgende vraag →';
}

function nextQuestion() {
  current++;
  if (current >= total) {
    showScore();
  } else {
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function showScore() {
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('next-wrap').classList.remove('show');
  document.getElementById('topbar').style.display = 'none';

  const pct = score / total;
  document.getElementById('score-screen').classList.add('show');
  document.getElementById('sc-num').textContent = score;
  document.getElementById('sc-denom').textContent = `van de ${total} goed`;

  let emoji, msg;
  if (pct === 1)       { emoji='🏆'; msg='Perfect! Elk biedverloop klopte precies.'; }
  else if (pct >= 0.8) { emoji='🎯'; msg='Uitstekend — bijna perfect!'; }
  else if (pct >= 0.6) { emoji='👍'; msg='Goede basis. Herhaal de uitleg bij de fouten.'; }
  else                 { emoji='📖'; msg='Blijf oefenen — het biedverloop komt met herhaling!'; }

  document.getElementById('sc-emoji').textContent = emoji;
  document.getElementById('sc-msg').textContent = msg;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  current = 0; score = 0;
  document.getElementById('main-card').style.display = '';
  document.getElementById('topbar').style.display = '';
  document.getElementById('score-screen').classList.remove('show');
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
renderQuestion();
</script>
</body>
</html>
